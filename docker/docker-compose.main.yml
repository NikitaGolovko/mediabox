version: "3.3"

services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONTAINERS}/watchtower/config:/config
    command: --label-enable --cleanup --schedule "0 0 4 * * *"
    restart: unless-stopped
  
  traefik:
    image: traefik
    restart: always
    container_name: traefik
    command:
      - --api.insecure=true
      - --api.dashboard=false
      - --api.debug=true
      - --log.level=DEBUG
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --add-host=host.docker.internal:host-gateway
    environment:
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_API_KEY=${CF_API_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/nikita/repo/docker/data/traefik/traefik.yml:/traefik.yml:ro
      - /home/nikita/repo/docker/data/traefik/config.yml:/config.yml
      - /home/nikita/repo/docker/data/traefik/letsencrypt:/letsencrypt
      - /home/nikita/repo/docker/data/traefik/traefik.log:/traefik.log
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    labels:
      - traefik.enable=true
      - traefik.docker.network=mediabox_network_main
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.tls.certresolver=cloudflare
      - traefik.http.routers.traefik.tls.domains[0].main=${DOMAIN}
      - traefik.http.routers.traefik.tls.domains[0].sans=*.${DOMAIN}
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.api.rule=Host(`traefik1.${DOMAIN}`)

  portainer1:
    image: portainer/portainer-ce
    container_name: portainer1
    networks:
      network_main:
        ipv4_address: 172.20.2.2
    ports:
      - 9000:9000
      - 8000:8000
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: always
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONTAINERS}/portainer:/data

  portainer_agent:
    image: portainer/agent
    container_name: portainer-agent
    networks:
      network_main:
        ipv4_address: 172.20.2.3
    ports:
      - 9001:9001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
  homer:
    image: b4bz/homer
    container_name: homer
    networks:
      network_main:
        ipv4_address: 172.20.4.1
    ports:
      - 8092:8080
    volumes:
      - /home/nikita/repo/docker/data/homer/assets:/www/assets
    environment:
      - INIT_ASSETS=0 # default
      - UID=${PUID}
      - GID=${PGID}
      - TZ=${TIMEZONE}
    user: ${PUID}:${PGID}

networks:
  network_main:
    ipam:
      driver: bridge
      config:
        - subnet: 172.20.0.0/16
  nextcloud-aio:
    external: true