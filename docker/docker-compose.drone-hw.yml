services:
  webodm_webapp:
    depends_on:
      - node-odm
    environment:
      - WO_DEFAULT_NODES
  node-odm:
    image: opendronemap/nodeodm:gpu
    container_name: node-odm
    expose:
      - "3000"
    networks:
      mediabox_network_main:
        ipv4_address: 172.20.12.6
    restart: unless-stopped
    oom_score_adj: 500
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]