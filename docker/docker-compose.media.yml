version: "3.5"

services:
  plex:
    image: linuxserver/plex
    container_name: plex
    networks:
      network_main:
        ipv4_address: 172.20.7.5
    ports:
      - 32400:32400/tcp
      - 32400:32400/udp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - PUID=${PUID}
      - PGID=1001
      - VERSION=docker
      - ADVERTISE_IP="https://plex.${DOMAIN}:443"
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${CONTAINERS}/plex/config:/config
      - ${DATA}/Movies:/movies
      - ${DATA}/TV:/tv
      - ${DATA}/Music:/music

    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    networks:
      network_main:
        ipv4_address: 172.20.7.15
    ports:
      - 8989:8989
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONTAINERS}/sonarr/config:/config
      - ${DOWNLOADS}/torrents:/downloads # Not used
      - ${DATA}:/data
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    networks:
      network_main:
        ipv4_address: 172.20.7.25
    ports:
      - 7878:7878
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - PUID=${PUID}
      - PGID=995
      - TZ=${TIMEZONE}
    volumes:
      - ${CONTAINERS}/radarr/config:/config
      - ${DOWNLOADS}/torrents:/downloads
      - ${DATA}:/data
    restart: unless-stopped

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr
    container_name: prowlarr
    networks:
      network_main:
        ipv4_address: 172.20.7.65
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONTAINERS}/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  bookstack:
    image: linuxserver/bookstack
    container_name: bookstack
    networks:
      network_main:
        ipv4_address: 172.20.7.75
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - APP_URL=https://bookstack.${DOMAIN}
      - DB_HOST=bookstack_db
      - DB_USER=${BOOKSTACK_DB_USERNAME}
      - DB_PASS=${BOOKSTACK_DB_PASSWORD}
      - DB_DATABASE=bookstackapp
    volumes:
      - ${CONTAINERS}/bookstack/config:/config
    ports:
      - 6875:6875
    restart: unless-stopped
    depends_on:
      - bookstack_db

  bookstack_db:
    image: linuxserver/mariadb
    container_name: bookstack_db
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_DB_PASSWORD}
      - MYSQL_DATABASE=bookstackapp
      - MYSQL_USER=${BOOKSTACK_DB_USERNAME}
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASSWORD}
    volumes:
      - ${CONTAINERS}/bookstack/db:/config
    restart: unless-stopped
