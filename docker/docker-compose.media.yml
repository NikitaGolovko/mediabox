#version: '3.9'

services:
  plex:
    image: linuxserver/plex
    container_name: plex
    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.5
    ports:
      - 32400:32400/tcp
      - 32400:32400/udp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - PUID=${PUID}
      - PGID=1001
      - VERSION=docker
      - ADVERTISE_IP="https://plex.${DOMAIN}:443"
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${CONTAINERS}/plex/config:/config
      - ${DATA}/Movies:/movies
      - ${DATA}/TV:/tv
      - ${DATA}/Music:/music
      - ${DATA2}/movies:/movies2
      - ${DATA2}/tv:/tv2

    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin

    # Same custom network as Plex, different IP
    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.7   # make sure this is unused

    ports:
      - 8096:8096/tcp      # Jellyfin web UI
      - 7359:7359/udp      # Discovery
      # Don't expose 1900/udp because Plex is already using it for DLNA
      # - 1900:1900/udp

    labels:
      - com.centurylinklabs.watchtower.enable=true

    # With the official image, PUID/PGID env vars don't do anything.
    # To "do what Plex does" permission-wise, run the container as that user:
    user: "${PUID}:1001"

    environment:
      - TZ=America/New_York
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${DOMAIN}:443

    volumes:
      # Config + cache
      - ${CONTAINERS}/jellyfin/config:/config
      - ${CONTAINERS}/jellyfin/cache:/cache

      # Media – mirroring Plex's layout
      - ${DATA}/Movies:/media/movies
      - ${DATA}/TV:/media/tv
      - ${DATA}/Music:/media/music
      - ${DATA2}/movies:/media2/movies
      - ${DATA2}/tv:/media2/tv
      - ${DATA2}/media/intros:/media/intros

    # Hardware transcoding "like Plex" – just /dev/dri
    # devices:
    #   - /dev/dri:/dev/dri

    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr

    environment:
      - LOG_LEVEL=debug
      - TZ=${TIMEZONE}
      - PORT=5055

    ports:
      - 5055:5055

    volumes:
      - ${CONTAINERS}/jellyseerr/appdata/config:/app/config

    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.15
    ports:
      - 8989:8989
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONTAINERS}/sonarr/config:/config
      - ${DOWNLOADS}/torrents:/downloads # Not used
      - ${DATA}:/data
      - ${DATA2}/tv:/tv
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.25
    ports:
      - 7878:7878
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONTAINERS}/radarr/config:/config
      - ${DOWNLOADS}/torrents:/downloads
      - ${DATA}:/data
      - ${DATA2}/movies:/movies
    restart: unless-stopped
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr

    user: "${PUID}:${PGID}"

    environment:
      - TZ=${TIMEZONE}

      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/downloads
      - UN_RADARR_0_PROTOCOLS=torrent,TorrentDownloadProtocol

      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/downloads
      - UN_SONARR_0_PROTOCOLS=torrent,TorrentDownloadProtocol

      - UN_INTERVAL=2m
      - UN_START_DELAY=1m
      - UN_PARALLEL=1

      # Important for torrents:
      - UN_RADARR_0_DELETE_ORIG=false
      - UN_SONARR_0_DELETE_ORIG=false

    volumes:
      - ${DOWNLOADS}/torrents:/downloads

    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.68

    restart: unless-stopped

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr
    container_name: prowlarr
    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.65
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ${CONTAINERS}/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr

    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - LANG=en-US
      - TZ=${TIMEZONE}

    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.66

    # Optional. Prowlarr can reach it internally by container name,
    # so you do not actually need to expose this to the host.
    # ports:
    #   - 8191:8191

    restart: unless-stopped
 
  bookstack:
    image: linuxserver/bookstack
    container_name: bookstack
    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.75
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - APP_URL=https://bookstack.${DOMAIN}
      - DB_HOST=172.20.7.77
      - DB_USER=${BOOKSTACK_DB_USERNAME}
      - DB_PASS=${BOOKSTACK_DB_PASSWORD}
      - DB_DATABASE=bookstackapp
    volumes:
      - ${CONTAINERS}/bookstack/config:/config
    ports:
      - 6875:80
    restart: unless-stopped
    depends_on:
      - bookstack_db

  bookstack_db:
    image: linuxserver/mariadb:10.5.13
    container_name: bookstack_db
    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.77
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_DB_PASSWORD}
      - MYSQL_DATABASE=bookstackapp
      - MYSQL_USER=${BOOKSTACK_DB_USERNAME}
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASSWORD}
    volumes:
      - ${CONTAINERS}/bookstack/db:/config
    restart: unless-stopped


  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.81
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
    user: "${PUID}:${PGID}"
    volumes:
      - ${CONTAINERS}/navidrome/data:/data
      - ${DATA}/Music:/music:ro
    restart: unless-stopped

  subwave:
    image: ghcr.io/perminder-klair/subwave-aio:latest
    container_name: subwave
    networks:
      mediabox_network_main:
        ipv4_address: 172.20.7.85
    ports:
      - "7700:80"
    environment:
      - ADMIN_USER=${SUBWAVE_ADMIN_USER}
      - ADMIN_PASS=${SUBWAVE_ADMIN_PASS}
      - SITE_URL=https://radio.${DOMAIN}
      - TZ=America/New_York
    volumes:
      - ${CONTAINERS}/subwave/data:/var/sub-wave
    restart: unless-stopped
